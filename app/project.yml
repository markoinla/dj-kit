name: DJKit
options:
  bundleIdPrefix: la.marko
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
  xcodeVersion: "16.4"

# The engine packages, by local path (DJKit/Engines/README.md).
packages:
  QualityKit:
    path: ../Packages/QualityKit
  StemsKit:
    path: ../Packages/StemsKit
  ApolloMLX:
    path: ../Packages/ApolloMLX
  AudioExport:
    path: ../Packages/AudioExport
  LoudnessKit:
    path: ../Packages/LoudnessKit
  AnalysisKit:
    path: ../Packages/AnalysisKit
  # Auto-updates for the notarized DMG build (scripts/release.sh).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.7.0

schemes:
  DJKit:
    build:
      targets:
        DJKit: all
    run:
      config: Debug
      commandLineArguments:
        "-useFakeEngines": true
    archive:
      config: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.4"
    # Apple Silicon only (MLX).
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    # Signed with the team so ShazamKit and MusicKit (App Services on the
    # App ID la.marko.djtools) accept the app. No provisioning profile needed.
    # Release (the DMG) is Developer ID, notarized by scripts/release.sh.
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: M44R9APYMG
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    # Bumped by scripts/release.sh. CURRENT_PROJECT_VERSION is Sparkle's
    # build number and goes up with every release.
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
  configs:
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"

targets:
  DJKit:
    type: application
    platform: macOS
    sources:
      - path: DJKit
        excludes:
          - "**/*.md"
    info:
      path: DJKit/Info.plist
      properties:
        CFBundleDisplayName: DJ Kit
        CFBundleName: DJ Kit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: ""
        # Track ID: MusicKit catalog lookups ask for this before they run.
        NSAppleMusicUsageDescription: DJ Kit looks up album, label, release date and artwork for identified tracks in the Apple Music catalog.
        # Manrope (Resources/Fonts) is registered at launch.
        ATSApplicationFontsPath: .
        # Sparkle 2: the latest GitHub release's appcast.xml. The private key
        # is in the login keychain (generate_keys --account djkit).
        SUFeedURL: https://github.com/markoinla/dj-kit/releases/latest/download/appcast.xml
        SUPublicEDKey: SsCRJP7OuuN6bdTMSwZ19asG1ujxY03zW5t+ljxbmT8=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: la.marko.djtools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: DJKit
        INFOPLIST_FILE: DJKit/Info.plist
        # Notarization requires it.
        ENABLE_HARDENED_RUNTIME: YES
        # Not sandboxed (yet): results go to any folder the user picks.
        ENABLE_APP_SANDBOX: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: AVFoundation.framework
      - package: QualityKit
      - package: StemsKit
      - package: ApolloMLX
        product: ApolloMLX
      - package: AudioExport
      - package: LoudnessKit
        product: LoudnessKit
      - package: AnalysisKit
        product: AnalysisKit
      - package: Sparkle
